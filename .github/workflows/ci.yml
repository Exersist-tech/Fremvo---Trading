name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Trading.sln

      - name: Build solution
        run: dotnet build Trading.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Trading.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
